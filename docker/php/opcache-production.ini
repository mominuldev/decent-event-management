; Standard production defaults for a request/response PHP-FPM app. Not
; tuned against real traffic — nothing in this environment can generate any
; — revisit memory_consumption and max_accelerated_files against actual
; class/file counts once this runs somewhere real.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
