# Standard Laravel nginx vhost, running in the same container as php-fpm
# (see Dockerfile) — fastcgi_pass targets 127.0.0.1, not a service name,
# because the two processes share one network namespace here, not two.
#
# Security response headers are deliberately NOT duplicated here —
# App\Http\Middleware\SetSecurityHeaders already sets the full docs/06
# §6.7 header set application-side, and a load balancer or CDN in front of
# this (docs/07 §7.3) is the more likely place a second copy would actually
# be needed; adding a second, easy-to-drift copy here for no concrete
# reason is the kind of change this codebase's own conventions argue
# against.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # PHP-FPM serves ticket PDFs/QR images itself via signed URLs
    # (SignedMediaController) — nginx never serves storage/ directly.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
