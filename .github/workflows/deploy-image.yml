name: Build & Publish Release Image

# Phase 9 (docs/08 §Phase 9): the "release" half of a zero-downtime deploy
# pipeline — build the image, prove the migration set still applies
# cleanly, prove the image actually boots, then publish a tagged,
# immutable, sha-addressable artifact. What's deliberately NOT here: a step
# that deploys this image to a live host and cuts traffic over. No hosting
# provider is named anywhere in docs/07 (§7.3 specs sizing, not a vendor),
# so that step doesn't exist yet for the same reason a real SmsDriver
# doesn't — CLAUDE.md's External Dependencies list. Add a `deploy` job here
# once a provider is chosen; until then, an operator pulls the published
# tag and rolls it out by hand, running `db:restore --verify`-style
# judgement, not a rubber-stamped merge.
#
# GHCR (ghcr.io) rather than a third-party registry is deliberate too: it
# needs no new secret beyond the `GITHUB_TOKEN` every workflow already gets,
# so this doesn't block on provisioning anything either.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  migrate-dry-run:
    name: Migration set applies cleanly
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: decent_event_deploy_check
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot --silent && break
            sleep 1
          done
      # The real gate: every migration this branch adds must apply cleanly
      # to a fresh database with no manual intervention, since that's
      # exactly what the deploy pipeline's real `migrate --force` step does
      # against production before traffic ever reaches the new image.
      - run: php artisan migrate --pretend
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: decent_event_deploy_check
      - run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: decent_event_deploy_check

  build-and-publish:
    name: Build, boot-check, and publish image
    needs: migrate-dry-run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not yet pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: release-candidate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Minimal boot check, deliberately not a full DB/Redis smoke test:
      # proves the image's PHP extensions, vendor autoloading, and
      # entrypoint don't fail outright (the class of bug a missing
      # docker-php-ext-install would cause) without needing to stand up
      # and network together MySQL/Redis service containers for a `docker
      # run` invocation, which is a second, larger unverified surface this
      # slice deliberately didn't take on. See Dockerfile's own header
      # comment: this workflow run is this image's first real build ever —
      # nothing in the prior dev environment had a Docker daemon to test
      # against.
      - name: Boot-check the built image
        run: docker run --rm --entrypoint php release-candidate:${{ github.sha }} artisan --version

      # PDF rendering is an out-of-process dependency, so a base-image change
      # that moves or drops the Chromium binary would not fail any of the
      # checks above — it would surface as tickets failing to render in
      # production. One cheap assertion here closes that.
      - name: Assert the PDF renderer's binary is present
        run: docker run --rm --entrypoint /usr/bin/chromium release-candidate:${{ github.sha }} --version

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker tag release-candidate:${{ github.sha }} "${IMAGE}:${{ github.sha }}"
          docker tag release-candidate:${{ github.sha }} "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"
