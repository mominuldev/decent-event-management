name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: portal-event-management-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, sqlite3, zip, gd, curl, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static Analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=2G

      - name: Run Tests
        run: php artisan test

      - name: Composer Audit
        run: composer audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The SPA once shipped as one 2,120 KB (533 KB gzipped) chunk because every screen was a
      # static import in router.tsx. Vite's own warning was the only signal and it scrolled past.
      - name: Check bundle budget
        run: npm run check:bundle

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -e

          echo "Checking secrets..."

          [ -n "$SSH_HOST" ] || (echo "HOSTINGER_SSH_HOST missing" && exit 1)
          [ -n "$SSH_USER" ] || (echo "HOSTINGER_SSH_USER missing" && exit 1)
          [ -n "$SSH_KEY" ] || (echo "HOSTINGER_SSH_KEY missing" && exit 1)

          mkdir -p ~/.ssh

          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SSH_PORT=${SSH_PORT:-65002}

          echo "Testing SSH connection..."

          ssh-keyscan -v -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH Login
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          SSH_PORT=${SSH_PORT:-65002}

          ssh -i ~/.ssh/id_rsa \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "echo 'SSH Connection Successful'"

      - name: Deploy Files
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          SSH_PORT=${SSH_PORT:-65002}

          [ -n "$DEPLOY_PATH" ] || (echo "HOSTINGER_DEPLOY_PATH missing" && exit 1)

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p $SSH_PORT" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="tests" \
            --exclude=".env" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
