name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

# Superseded PR runs are worth cancelling; a run on main is not, because this
# workflow deploys. Interrupting one between `rsync --delete` and
# `migrate --force` leaves the host serving new code against an old schema,
# which is why deploy.yml sets cancel-in-progress: false for the same reason.
concurrency:
  group: portal-event-management-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # Tests need a real MySQL 8, not SQLite: migrations use utf8mb4_0900_ai_ci
    # collation, VARBINARY IP columns and STORED generated columns SQLite
    # cannot represent (phpunit.xml says the same). Redis is what
    # CheckApplicationHealth and the Horizon config resolve to.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: decent_event_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.json requires ^8.3 and pins config.platform.php to 8.3.0.
          php-version: '8.3'
          # sodium is load-bearing — QrSigner signs every ticket with it.
          extensions: mbstring, xml, zip, gd, curl, bcmath, intl, sodium, pdo_mysql, redis
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # SecurityHeadersTest requests the SPA shell (`/login`) and asserts its
      # inline script's nonce matches the CSP header. That shell renders
      # `@vite(...)`, which throws without a build manifest — the whole
      # response becomes an error page and the nonce assertion fails. The
      # assets are gitignored, so CI has to build them; a developer's box
      # passes only because a previous `npm run build` left them behind.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build SPA assets for the shell tests
        run: |
          npm ci
          npm run build

      # Ticket and directory PDFs render through headless Chrome
      # (config/pdf.php), and the Bangla text-layer tests read the result back
      # with pdftotext. Both are installed explicitly rather than relying on
      # whatever the runner image happens to ship, so a runner image change
      # shows up as a failed install rather than as tests quietly skipping
      # themselves.
      - name: Install Chromium and poppler-utils for PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser poppler-utils \
            || sudo apt-get install -y --no-install-recommends chromium poppler-utils

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static Analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot --silent && break
            sleep 1
          done

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: decent_event_testing

      - name: Run Tests
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: decent_event_testing
          REDIS_HOST: 127.0.0.1

      - name: Composer Audit
        run: composer audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # package.json defines exactly three scripts: dev, build, typecheck.
      # This repo has no ESLint config, no frontend test runner and no
      # bundle-budget script — steps for those belong here once they exist.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, zip, gd, curl, bcmath, intl, sodium, pdo_mysql, redis
          tools: composer:v2
          coverage: none

      # Built here rather than on the shared host: the release has to carry a
      # vendor/ tree, because the rsync below runs --delete and would
      # otherwise wipe the server's.
      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # Hostinger's panel presents SSH access as a whole command --
      # `ssh -p 65002 u123456789@82.180.132.207` -- so that string, or a bare
      # `user@host`, is what usually ends up in HOSTINGER_SSH_HOST. Handed
      # straight to ssh-keyscan it looks up a host literally called "ssh" and
      # fails with a name-resolution error that reads like a network fault.
      # Normalise once here and export the parts every later step uses.
      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -e

          echo "Checking secrets..."

          [ -n "$SSH_HOST" ] || { echo "HOSTINGER_SSH_HOST missing"; exit 1; }
          [ -n "$SSH_KEY" ] || { echo "HOSTINGER_SSH_KEY missing"; exit 1; }

          host=$(printf '%s' "$SSH_HOST" | tr -d '\r' | xargs)
          user=$(printf '%s' "$SSH_USER" | tr -d '\r' | xargs)
          port=$(printf '%s' "$SSH_PORT" | tr -d '\r' | xargs)

          # `ssh [-p PORT] [user@]host` pasted whole: take the port if it
          # carries one and no port secret was set, then the last word.
          case "$host" in
            ssh\ *|ssh://*)
              echo "HOSTINGER_SSH_HOST looks like a connection command or URL; parsing it."
              embedded_port=$(printf '%s' "$host" | sed -n 's/.*-p[[:space:]]*\([0-9][0-9]*\).*/\1/p')
              [ -n "$embedded_port" ] && [ -z "$port" ] && port="$embedded_port"
              host=${host##* }
              host=${host#ssh://}
              ;;
          esac

          # `user@host` in the host secret: the user half wins only when
          # HOSTINGER_SSH_USER was not set, so an explicit secret still rules.
          case "$host" in
            *@*)
              [ -n "$user" ] || user=${host%@*}
              host=${host#*@}
              ;;
          esac

          # A trailing `:port` (the URL form), same precedence rule.
          case "$host" in
            *:[0-9]*)
              [ -n "$port" ] || port=${host##*:}
              host=${host%:*}
              ;;
          esac

          host=${host%/}
          port=${port:-65002}

          [ -n "$user" ] || { echo "HOSTINGER_SSH_USER missing, and HOSTINGER_SSH_HOST carries no user@ to fall back on"; exit 1; }

          # The parsed values are no longer byte-identical to the secrets, so
          # nothing masks them any more. Register them before they can reach
          # a log line.
          echo "::add-mask::$host"
          echo "::add-mask::$user"

          if ! getent hosts "$host" >/dev/null 2>&1; then
            echo "HOSTINGER_SSH_HOST does not resolve to an address."
            echo "Set it to the hostname or IP alone -- for example 82.180.132.207 --"
            echo "with the username in HOSTINGER_SSH_USER and the port in HOSTINGER_SSH_PORT."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "$port" "$host" >> ~/.ssh/known_hosts 2>/dev/null

          {
            echo "DEPLOY_SSH_HOST=$host"
            echo "DEPLOY_SSH_USER=$user"
            echo "DEPLOY_SSH_PORT=$port"
          } >> "$GITHUB_ENV"

          echo "SSH target resolved; port $port."

      - name: Verify SSH Login
        run: |
          ssh -i ~/.ssh/id_rsa \
            -p "$DEPLOY_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "echo 'SSH Connection Successful'"

      # --delete removes anything on the host the checkout does not carry, so
      # every path that lives only on the server must be excluded explicitly:
      # .env holds the credentials, storage/ holds uploaded media, generated
      # ticket PDFs and the logs, and public/storage is the symlink into it.
      - name: Deploy Files
        env:
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -e

          [ -n "$DEPLOY_PATH" ] || { echo "HOSTINGER_DEPLOY_PATH missing"; exit 1; }

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p $DEPLOY_SSH_PORT" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="tests" \
            --exclude=".env" \
            --exclude="storage/" \
            --exclude="public/storage" \
            ./ "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$DEPLOY_PATH"

      # Migrations run against the release that was just uploaded. Horizon is
      # asked to finish the job in hand rather than killed, so a notification
      # or a half-rendered ticket is not dropped mid-flight.
      - name: Migrate and refresh caches
        env:
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_rsa -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=no \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "set -e
              cd '$DEPLOY_PATH'
              php artisan migrate --force
              php artisan storage:link || true
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              php artisan horizon:terminate || true"
